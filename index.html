<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>おえかきリレー｜キャンバス試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f1c3d;
  --bg:#2c2858;
  --bg2:#3a3572;
  --cream:#fff8e6;
  --paper:#ffffff;
  --yellow:#ffd23f;
  --pink:#ff6b8b;
  --mint:#4fd1a5;
  --b:64px;      /* ボタンの大きさ（JSで画面に合わせて調整） */
  --hd:64px;     /* ヘッダーの高さ */
  --gap:10px;
  --title:'Dela Gothic One','Hiragino Sans','Meiryo',sans-serif;
  --body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--body);font-weight:700;color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);
  background-size:22px 22px;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#app{
  width:100vw;height:100dvh;display:grid;
  grid-template-rows:var(--hd) 1fr;
  padding:10px 14px 14px;gap:10px;
}

/* ===== ヘッダー ===== */
header{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  height:calc(var(--hd)*1.22);width:auto;display:block;flex:none;
  margin:calc(var(--hd)*-.11) 0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.28));
}
.tag{
  font-family:var(--title);font-size:13px;color:var(--ink);background:var(--mint);
  border:3px solid var(--ink);border-radius:999px;padding:3px 12px;white-space:nowrap;
  box-shadow:0 3px 0 var(--ink);
}
.spacer{flex:1}
.chip{
  height:calc(var(--hd)*.68);display:flex;align-items:center;gap:8px;
  background:var(--cream);border:3px solid var(--ink);border-radius:14px;
  padding:0 14px;box-shadow:0 4px 0 var(--ink);white-space:nowrap;font-size:15px;
}
.chip small{font-size:12px;color:#6b6790}
.chip .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.chip b{font-family:var(--title);font-weight:400;font-size:15px;min-width:3.2em;text-align:right}

/* ===== メイン ===== */
main{display:grid;grid-template-columns:auto 1fr auto;gap:14px;min-height:0}
.panel{
  background:var(--cream);border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 6px 0 var(--ink);padding:12px 12px 16px;
  display:flex;flex-direction:column;justify-content:center;gap:8px;align-self:center;
}
.plabel{
  font-family:var(--title);font-size:14px;line-height:1;color:var(--cream);
  background:var(--ink);border-radius:8px;padding:5px 0;text-align:center;
}
.grid3{display:grid;grid-template-columns:repeat(3,var(--b));gap:var(--gap);padding-bottom:6px}

/* ===== ボタン（共通の手触り） ===== */
.btn{
  width:var(--b);height:var(--b);position:relative;
  border:3px solid var(--ink);border-radius:16px;background:#fff;
  box-shadow:0 6px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--body);font-weight:900;font-size:max(10px,calc(var(--b)*.18));color:var(--ink);
  cursor:pointer;transition:transform .07s ease-out,box-shadow .07s ease-out,background .12s;
  overflow:hidden;
}
.btn::after{ /* つやのハイライト */
  content:"";position:absolute;left:14%;right:14%;top:5%;height:13%;
  border-radius:999px;background:rgba(255,255,255,.6);pointer-events:none;z-index:0;
}
.btn > *{position:relative;z-index:1}
.btn svg{width:calc(var(--b)*.42);height:calc(var(--b)*.42);flex:none}
.btn span{line-height:1;white-space:nowrap}
.btn.press{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.on{background:var(--yellow)}
.btn:disabled{opacity:.38;cursor:default}
.btn.danger{background:#ffe1e6}

/* プロ用パレット（シンプルの12色ボタンとまったく同じ大きさの場所に入る） */
.pro{
  display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr);gap:4px;
  width:calc(3*var(--b) + 2*var(--gap));height:calc(4*var(--b) + 3*var(--gap) + 6px);padding-bottom:6px;
}
.pc{
  border:2px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);cursor:pointer;
  transition:transform .06s ease-out,box-shadow .06s ease-out;position:relative;
}
.pc.press{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pc.on{box-shadow:0 0 0 3px var(--yellow),0 3px 0 3px var(--ink);z-index:2}
.pc.on::after{content:"";position:absolute;inset:3px;border:2px solid #fff;border-radius:4px}
.hide{display:none !important}
.wbtn.done{width:calc(3*var(--b) + 2*var(--gap));height:calc(var(--b)*.85);margin-top:8px;font-size:20px}
.wbtn:disabled{opacity:.4}
.wbtn.on{background:var(--yellow)}
.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:22px 22px}
.screen.show{display:flex}
.biglogo{height:min(30dvh,200px);filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.wbtn.big{width:230px;height:64px;font-size:20px}
.col{display:flex;flex-direction:column;gap:14px;align-items:center}
.row.center{align-items:center}
.lbl{font-family:var(--title);font-size:17px;width:96px}
.wbtn.sq{width:56px;font-size:24px}
.num{font-family:var(--title);font-weight:400;font-size:30px;width:64px;text-align:center}
.names{display:grid;grid-template-columns:repeat(2,240px);gap:8px 14px}
.names input,.tin{height:44px;width:240px;border:3px solid var(--ink);border-radius:12px;padding:0 12px;background:#fff;color:var(--ink);
  font-family:var(--body);font-weight:700;font-size:17px;outline:none;user-select:text;-webkit-user-select:text}
.names input:focus,.tin:focus{box-shadow:0 0 0 3px var(--yellow)}
.huge{font-size:46px !important}
.small{font-size:15px;color:#6b6790}
.wimg{width:min(480px,48vw);aspect-ratio:3/2;border:3px solid var(--ink);border-radius:12px;background:#fff}
.rbox{width:min(600px,70vw);height:min(400px,calc(100dvh - 270px));border:3px solid var(--ink);border-radius:14px;background:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .rbox img{width:100%;height:100%;object-fit:contain;border:none;border-radius:0;aspect-ratio:auto}
.rbox .say{font-family:var(--title);font-size:40px;padding:20px;text-align:center;word-break:break-all}
.wbtn.hist{width:440px;height:52px;font-family:var(--body);font-weight:900;font-size:17px;padding:0 16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* シンプル／プロ 切りかえスイッチ */
.seg{
  position:relative;width:calc(3*var(--b) + 2*var(--gap));height:calc(var(--b)*.62);flex:none;
  border:3px solid var(--ink);border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--ink);
  display:grid;grid-template-columns:1fr 1fr;margin-bottom:4px;cursor:pointer;
}
.seg .knob{
  position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 6px);
  background:var(--yellow);border:2px solid var(--ink);border-radius:999px;
  transition:left .22s cubic-bezier(.3,1.5,.5,1);
}
.seg.pro-on .knob{left:calc(50% + 3px)}
.seg span{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--title);font-size:max(11px,calc(var(--b)*.2));line-height:1;white-space:nowrap;
  color:#8a86a8;transition:color .15s;
}
.seg:not(.pro-on) span:first-of-type,.seg.pro-on span:last-of-type{color:var(--ink)}

/* 色ボタン */
.sw{background:#fff}
.sw i{width:58%;height:58%;border-radius:50%;border:3px solid var(--ink);display:block}
.sw.on{background:var(--yellow)}
.sw.on i{box-shadow:0 0 0 3px #fff inset}

/* 太さボタン */
.sz em{width:calc(var(--b)*.42);height:calc(var(--b)*.42);display:flex;align-items:center;justify-content:center;flex:none}
.sz i{background:var(--ink);border-radius:50%;display:block}

/* ===== キャンバス ===== */
#stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#paperWrap{
  position:relative;background:var(--paper);
  border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);
  overflow:hidden;
}
#paperWrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
#cursor{
  position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;
  border:2px solid rgba(31,28,61,.7);box-shadow:0 0 0 1px rgba(255,255,255,.9);
  transform:translate(-50%,-50%);display:none;
}

/* ===== モーダル ===== */
.modal{
  position:fixed;inset:0;background:rgba(20,17,45,.72);display:none;
  align-items:center;justify-content:center;z-index:10;
}
.modal.show{display:flex}
.card{
  background:var(--cream);border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 8px 0 var(--ink);padding:22px 26px 26px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  max-width:calc(100vw - 40px);max-height:calc(100dvh - 40px);
  animation:pop .18s ease-out;
}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{font-family:var(--title);font-weight:400;font-size:24px}
.card p{font-size:15px;text-align:center;line-height:1.6}
.card img{width:min(420px,60vw);aspect-ratio:3/2;border:3px solid var(--ink);border-radius:12px;background:#fff;display:block}
.row{display:flex;gap:14px}
.wbtn{ /* 横長ボタン（モーダル用、すべて同じ大きさ） */
  width:150px;height:56px;border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 6px 0 var(--ink);background:#fff;
  font-family:var(--title);font-size:18px;color:var(--ink);cursor:pointer;
  transition:transform .07s ease-out,box-shadow .07s ease-out;
}
.wbtn.press{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.wbtn.red{background:var(--pink);color:#fff;-webkit-text-stroke:0}
.wbtn.yel{background:var(--yellow)}
.stat{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:15px}
.stat dt{color:#6b6790}
.stat dd{font-family:var(--title);font-weight:400;text-align:right}
/* ===== ゲーム画面 ===== */
.taskbox{flex:1;min-width:0;height:calc(var(--hd)*.86);display:flex;align-items:center;gap:12px;
  background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:0 16px}
.taskbox small{font-size:14px;color:#6b6790;white-space:nowrap;flex:none}
.taskbox b{font-family:var(--title);font-weight:400;font-size:calc(var(--hd)*.44);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.timer b{font-size:22px;min-width:1.6em;text-align:center}
.chip.timer.urgent{background:var(--pink);color:#fff;animation:shake .3s}
.chip.timer.urgent small{color:#fff}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.mode{width:260px;height:120px;border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-family:var(--body);
  transition:transform .07s ease-out,box-shadow .07s ease-out;position:relative}
.mode.press{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.mode em{position:absolute;top:-14px;left:-10px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--yellow);
  font-style:normal;font-family:var(--title);font-size:18px;display:flex;align-items:center;justify-content:center;border:3px solid var(--cream)}
.mode b{font-family:var(--title);font-weight:400;font-size:22px;white-space:nowrap}
.mode small{font-size:13px;font-weight:700;white-space:nowrap}
.mA{background:var(--yellow)} .mB{background:var(--mint)} .mC{background:#ffb3c2}
.modes{display:flex;gap:22px;margin-top:6px}

.setup{gap:12px;padding:18px 24px 22px}
.wbtn.opt{width:118px;height:48px;font-size:16px}
.wbtn.sq{height:48px}
.names input{height:40px}
.names{gap:6px 14px}

.pcard{min-width:min(720px,90vw)}
.prBig{font-family:var(--title);font-size:clamp(40px,7vw,76px);line-height:1.25;text-align:center;max-width:86vw}
.prBig span{display:inline-block;margin:0 .15em}
.wbtn.big{width:240px;height:64px;font-size:20px}

.shout{font-family:var(--title);font-size:clamp(44px,7vw,84px);color:var(--yellow);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  text-shadow:0 8px 0 var(--ink);animation:shout 1s ease-in-out infinite alternate;white-space:nowrap}
@keyframes shout{from{transform:scale(.96) rotate(-2deg)}to{transform:scale(1.04) rotate(2deg)}}

.rcard{gap:12px}
.rvTop{display:flex;align-items:center;gap:12px;max-width:min(600px,70vw)}
.rvNo{font-family:var(--title);font-size:14px;background:var(--ink);color:var(--cream);border-radius:999px;padding:4px 12px;white-space:nowrap}
.card h2.rvTitle{font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbox{position:relative}
.curtain{font-family:var(--title);font-size:140px;color:#d8d4ee;animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.08)}}
.reveal{animation:revealIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes revealIn{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rbox > img.reveal,.rbox > .say.reveal{width:100%;height:100%}
.rbox .say{display:flex;align-items:center;align-content:center;justify-content:center;flex-wrap:wrap}
.rbox .say span{display:inline-block;margin:0 .12em}
.stamp{position:absolute;right:18px;bottom:16px;font-family:var(--title);font-size:34px;color:#fff;background:var(--pink);
  border:4px solid var(--ink);border-radius:16px;padding:6px 18px;transform:rotate(-8deg);box-shadow:0 5px 0 var(--ink);
  animation:stampIn .5s cubic-bezier(.2,1.8,.4,1);white-space:nowrap}
.stamp.soso{background:var(--mint);color:var(--ink)}
@keyframes stampIn{from{transform:scale(3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}

.listscr{justify-content:flex-start;padding:14px 18px 18px;gap:12px}
.lsTop{width:100%;display:flex;align-items:center;gap:14px}
.lsTop h2{font-family:var(--title);font-weight:400;font-size:24px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lsArea{position:relative;width:100%;flex:1;min-height:0}
.lc{position:absolute}
.lc .lab{height:24px;font-size:14px;font-weight:900;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.lc .lab i{font-style:normal;font-family:var(--title);background:var(--yellow);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:12px}
.lc .bx{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 4px 0 var(--ink);overflow:hidden;
  display:flex;align-items:center;align-content:center;justify-content:center;flex-wrap:wrap;text-align:center;font-family:var(--title);line-height:1.2;padding:4px}
.lc .bx img{width:100%;height:100%;object-fit:contain;display:block}
.lc .bx.img{padding:0}
.lc .bx.topic{background:var(--yellow)}
.lc .bx.word{background:var(--cream)}
.lc .bx span{display:inline-block;margin:0 .1em}
.arw{position:absolute;width:28px;height:28px;color:var(--yellow)}
.wbtn.hist{width:460px}
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="logo" id="logo" alt="おえかきリレー">
    <div class="taskbox"><small id="taskWho">じゆうにかく</small><b id="taskText">すきな絵を かこう</b></div>
    <div class="chip timer hide" id="timerChip"><small>のこり</small><b id="timerNum">0</b><small>びょう</small></div>
    <div class="chip"><small>いま</small><span class="dot" id="curDot"></span><span id="curText">ペン・ふつう</span></div>
    <div class="chip dbg"><small>にゅうりょく</small><b id="inType">ー</b></div>
    <div class="chip dbg"><small>ひつあつ</small><b id="inPress">ー</b></div>
  </header>

  <main>
    <!-- 左：いろ・ふとさ -->
    <section class="panel" id="leftPanel">
      <div class="plabel">いろ</div>
      <div class="grid3" id="colors"></div>
      <div class="pro hide" id="proColors"></div>
      <div class="seg" id="palMode"><div class="knob"></div><span>シンプル</span><span>プロ</span></div>
      <div class="plabel">ふとさ</div>
      <div class="grid3" id="sizes"></div>
    </section>

    <!-- 中央：キャンバス -->
    <section id="stage">
      <div id="paperWrap">
        <canvas id="cv" width="1200" height="800"></canvas>
        <div id="cursor"></div>
      </div>
    </section>

    <!-- 右：どうぐ -->
    <section class="panel" id="rightPanel">
      <div class="plabel">どうぐ</div>
      <div class="grid3">
        <button class="btn tool on" id="tPen" data-snd="sel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.6L16 4.6a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4"/></svg>
          <span>ペン</span></button>
        <button class="btn tool" id="tEraser" data-snd="sel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 20H20"/><path d="M5.2 15.8l9.6-9.6a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 19.1a3 3 0 0 1-4.2 0l-2.6-2.6a.5.5 0 0 1 0-.7z"/><path d="M9.5 11.5l5 5"/></svg>
          <span>けしゴム</span></button>
        <button class="btn tool" id="tFill" data-snd="sel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 3.8l8 8-6.6 6.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8z"/><path d="M4.2 11.6h13.6"/><path d="M8 5.6L6.2 3.8"/><path d="M20.5 15.5c.9 1.3 1.4 2.2 1.4 2.9a1.4 1.4 0 0 1-2.8 0c0-.7.5-1.6 1.4-2.9z"/></svg>
          <span>バケツ</span></button>
      </div>
      <div class="plabel">そうさ</div>
      <div class="grid3">
        <button class="btn " id="bUndo" data-snd="act">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>もどす</span></button>
        <button class="btn " id="bRedo" data-snd="act">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          <span>すすむ</span></button>
        <button class="btn danger" id="bClear" data-snd="act">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/></svg>
          <span>ぜんけし</span></button>
      </div>
      <div class="plabel">せってい</div>
      <div class="grid3">
        <button class="btn " id="bPenOnly" data-snd="sel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M9 14h6l-3 7z"/><path d="M9.5 3h5"/></svg>
          <span>ペンだけ</span></button>
        <button class="btn on" id="bPress" data-snd="sel">

    <h2>ぜんぶ けす？</h2>

<script>
(() => {
'use strict';
const W = 1200, H = 800;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('paperWrap');
const stage = document.getElementById('stage');
const cursorEl = document.getElementById('cursor');

/* ---------- 設定 ---------- */
const COLORS = [
  ['くろ','#23213a'],['グレー','#9a98a8'],
  ['あか','#e8434b'],['ピンク','#f28bb6'],
  ['オレンジ','#f59331'],['はだいろ','#f6cfa6'],
  ['きいろ','#f7cc2e'],['みどり','#3db66b'],
  ['みずいろ','#5ec8ef'],['あお','#3a6fe0'],
  ['むらさき','#8e55d0'],['ちゃいろ','#9a6235'],
];
// プロ用パレット：8列（しろ〜くろ／6色相／はだ〜ちゃ）× 明るさ6段
function hsl2hex(h,sat,l){
  sat/=100; l/=100;
  const k=n=>(n+h/30)%12, a=sat*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1))));
  return '#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
const PRO = [];
[['しろ','#ffffff'],['グレー1','#d9d9de'],['グレー2','#a9a8b4'],['グレー3','#75738a'],['グレー4','#4a4862'],['くろ','#23213a']].forEach(c=>PRO.push(c));
[['あか',355],['オレンジ',28],['きいろ',50],['みどり',135],['あお',215],['むらさき',275]].forEach(([n,h])=>{
  [88,76,63,50,38,26].forEach((l,i)=>PRO.push([n+(i+1), hsl2hex(h, h===50?92:82, l)]));
});
[['ちゃ1','#fde3cc'],['ちゃ2','#f6cfa6'],['ちゃ3','#e0a878'],['ちゃ4','#b97a4a'],['ちゃ5','#8a5530'],['ちゃ6','#5c3820']].forEach(c=>PRO.push(c));
const SIZES = [['ほそい',5],['ふつう',13],['ふとい',34]];

const st = {
  tool:'pen', color:COLORS[0][1], colorName:COLORS[0][0],
  size:SIZES[1][1], sizeName:SIZES[1][0],
  penOnly:false, pressure:true, sound:true, pal:'simple',
};
let strokes = [], redoStack = [], cur = null, activeId = null, base = 0; // base：モードCで前の人の線を守る

/* ---------- おと（WebAudioで合成。ファイル不要） ---------- */
let ac = null;
function blip(kind){
  if(!st.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    const f = kind==='sel' ? [660,990] : [440,520];
    o.type = 'triangle';
    o.frequency.setValueAtTime(f[0],t);
    o.frequency.exponentialRampToValueAtTime(f[1],t+.06);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.18,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+.11);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.12);
  }catch(e){}
}

/* ---------- ボタンの手触り（押しこみ＋おと） ---------- */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.wbtn,.pc,.mode');
  if(!b || b.disabled) return;
  b.classList.add('press'); blip(b.dataset.snd||'act');
  const up = () => { b.classList.remove('press'); removeEventListener('pointerup',up); removeEventListener('pointercancel',up); };
  addEventListener('pointerup',up); addEventListener('pointercancel',up);
});

/* ---------- パネル生成 ---------- */
const colorBox = document.getElementById('colors');
const proBox = document.getElementById('proColors');
function pickColor(hex,name){
  st.color = hex; st.colorName = name;
  if(st.tool==='eraser') setTool('pen'); else refreshStatus();
  markColor();
}
function markColor(){
  document.querySelectorAll('.sw,.pc').forEach(x=>x.classList.toggle('on', x.dataset.hex===st.color));
}
COLORS.forEach(([name,hex]) => {
  const b = document.createElement('button');
  b.className = 'btn sw'; b.dataset.snd='sel'; b.dataset.hex=hex; b.title=name;
  b.innerHTML = `<i style="background:${hex}"></i>`;
  b.onclick = () => pickColor(hex,name);
  colorBox.appendChild(b);
});
// プロは「明るさ」が横にならぶよう、列ごとに並べかえて配置（6列×8行）
for(let r=0;r<8;r++) for(let c=0;c<6;c++){
  const [name,hex] = PRO[r*6+c];
  const d = document.createElement('div');
  d.className='pc'; d.dataset.snd='sel'; d.dataset.hex=hex; d.title=name; d.style.background=hex;
  d.onclick = () => pickColor(hex,name);
  proBox.appendChild(d);
}
document.getElementById('palMode').addEventListener('click', () => {
  st.pal = st.pal==='simple' ? 'pro' : 'simple';
  const pro = st.pal==='pro';
  document.getElementById('palMode').classList.toggle('pro-on', pro);
  colorBox.classList.toggle('hide', pro); proBox.classList.toggle('hide', !pro);
  blip('sel'); markColor();
});
const sizeBox = document.getElementById('sizes');
SIZES.forEach(([name,px],i) => {
  const b = document.createElement('button');
  b.className = 'btn sz' + (i===1?' on':''); b.dataset.snd='sel';
  const d = [7,14,24][i];
  b.innerHTML = `<em><i style="width:${d}px;height:${d}px"></i></em><span>${name}</span>`;
  b.onclick = () => {
    sizeBox.querySelectorAll('.sz').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    st.size = px; st.sizeName = name; refreshStatus();
  };
  sizeBox.appendChild(b);
});

const $ = id => document.getElementById(id);
function setTool(t){
  st.tool = t;
  $('tPen').classList.toggle('on', t==='pen');
  $('tEraser').classList.toggle('on', t==='eraser');
  $('tFill').classList.toggle('on', t==='fill');
  refreshStatus();
}
$('tPen').onclick = () => setTool('pen');
$('tEraser').onclick = () => setTool('eraser');
$('tFill').onclick = () => setTool('fill');
$('bPenOnly').onclick = () => { st.penOnly = !st.penOnly; $('bPenOnly').classList.toggle('on', st.penOnly); };
$('bPress').onclick = () => { st.pressure = !st.pressure; $('bPress').classList.toggle('on', st.pressure); };
$('bSound').onclick = () => { st.sound = !st.sound; $('bSound').classList.toggle('on', st.sound); };

function refreshStatus(){
  $('curDot').style.background = st.tool==='eraser' ? '#fff' : st.color;
  $('curText').textContent =
    st.tool==='eraser' ? 'けしゴム・'+st.sizeName :
    st.tool==='fill'   ? 'バケツ・'+st.colorName : st.colorName+'・'+st.sizeName;
  $('bUndo').disabled = strokes.length<=base;
  $('bClear').disabled = base>0;
  $('bRedo').disabled = redoStack.length===0;
}

/* ---------- 描画エンジン ---------- */
function paperFill(c){ c.fillStyle='#fff'; c.fillRect(0,0,W,H); }
function strokeColor(s){ return s.tool==='eraser' ? '#ffffff' : s.color; }

function drawDot(c,s,p){
  c.fillStyle = strokeColor(s);
  c.beginPath(); c.arc(p[0],p[1],p[2]/2,0,Math.PI*2); c.fill();
}
// i番目の点までの区間を、なめらかな曲線で描く
function drawSeg(c,s,i){
  const P = s.pts; if(i<1) return;
  const p0 = P[i-2]||P[i-1], p1 = P[i-1], p2 = P[i];
  const m0 = [(p0[0]+p1[0])/2,(p0[1]+p1[1])/2];
  const m1 = [(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
  c.strokeStyle = strokeColor(s);
  c.lineWidth = (p1[2]+p2[2])/2;
  c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(m0[0],m0[1]); c.quadraticCurveTo(p1[0],p1[1],m1[0],m1[1]); c.stroke();
}
/* ---------- バケツ（塗りつぶし） ----------
   塗った範囲を「横1列ずつの区間」で記録するので、もどす・すすむでも同じ形に戻せる */
function hexRgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
function computeFill(fx,fy,hex){
  const x0=Math.floor(fx), y0=Math.floor(fy);
  if(x0<0||y0<0||x0>=W||y0>=H) return null;
  const img = ctx.getImageData(0,0,W,H).data;
  const k0=(y0*W+x0)*4, tr=img[k0], tg=img[k0+1], tb=img[k0+2];
  const [fr,fg,fb] = hexRgb(hex);
  if(Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb) < 12) return null; // 同じ色なら何もしない
  const T = 90;                       // 線のふちのぼかしを少しだけ含める
  const seen = new Uint8Array(W*H);
  const ok = p => { if(seen[p]) return false; const k=p*4;
    return Math.abs(img[k]-tr)+Math.abs(img[k+1]-tg)+Math.abs(img[k+2]-tb) <= T; };
  const spans=[], stack=[x0,y0];
  while(stack.length){
    const y=stack.pop(), x=stack.pop(), row=y*W;
    if(!ok(row+x)) continue;
    let l=x, r=x;
    while(l>0 && ok(row+l-1)) l--;
    while(r<W-1 && ok(row+r+1)) r++;
    seen.fill(1,row+l,row+r+1);
    spans.push(y,l,r);
    for(const ny of [y-1,y+1]){
      if(ny<0||ny>=H) continue;
      const nrow=ny*W; let i=l;
      while(i<=r){
        if(ok(nrow+i)){ stack.push(i,ny); while(i<=r && ok(nrow+i)) i++; }
        else i++;
      }
    }
  }
  return new Int16Array(spans);
}
function drawFill(c,s){
  c.fillStyle = s.color; const sp=s.spans;
  for(let i=0;i<sp.length;i+=3){       // 1ピクセルずつ広げて、白いすき間を残さない
    c.fillRect(sp[i+1]-1, sp[i]-1, sp[i+2]-sp[i+1]+3, 3);
  }
}
function drawStroke(c,s){
  if(s.tool==='fill'){ drawFill(c,s); return; }
  drawDot(c,s,s.pts[0]);
  for(let i=1;i<s.pts.length;i++) drawSeg(c,s,i);
  // 最後のはしっこ
  const n=s.pts.length; if(n>1){
    const a=s.pts[n-2], b=s.pts[n-1];
    c.strokeStyle=strokeColor(s); c.lineWidth=b[2]; c.lineCap='round';
    c.beginPath(); c.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2); c.lineTo(b[0],b[1]); c.stroke();
  }
}
// 「ぜんけし」は印として記録し、最後の印より後だけを描く（もどすで復活できる）
function renderAll(){
  paperFill(ctx);
  let start = 0;
  strokes.forEach((s,i)=>{ if(s.tool==='clear') start=i+1; });
  for(let i=start;i<strokes.length;i++) drawStroke(ctx,strokes[i]);
}

function toLocal(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height];
}
function widthFor(e, prevW){
  let w = st.size;
  if(st.pressure && st.tool==='pen' && e.pointerType==='pen' && e.pressure>0){
    const target = st.size*(0.35+e.pressure*1.05);
    w = prevW==null ? target : prevW*0.6 + target*0.4;
  }
  return Math.max(1.5,w);
}
function showInput(e){
  $('inType').textContent = {pen:'ペン',touch:'ゆび',mouse:'マウス'}[e.pointerType]||e.pointerType;
  $('inPress').textContent = e.pointerType==='pen' ? e.pressure.toFixed(2) : 'ー';
}

cv.addEventListener('pointerdown', e => {
  showInput(e);
  if(activeId!==null) return;                          // 2本目の指・手のひらは無視
  if(st.penOnly && e.pointerType==='touch') return;    // ペンだけモード
  if(e.pointerType==='mouse' && e.button!==0) return;
  e.preventDefault();
  if(st.tool==='fill'){
    const [fx,fy] = toLocal(e);
    const spans = computeFill(fx,fy,st.color);
    if(spans){ const f={tool:'fill',color:st.color,spans}; strokes.push(f); redoStack=[]; drawFill(ctx,f); refreshStatus(); blip('act'); }
    return;
  }
  activeId = e.pointerId; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const [x,y] = toLocal(e);
  cur = {tool:st.tool, color:st.color, pts:[[x,y,widthFor(e)]]};
  drawDot(ctx,cur,cur.pts[0]);
});
cv.addEventListener('pointermove', e => {
  moveCursor(e);
  if(e.pointerId!==activeId || !cur) return;
  showInput(e);
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const ev of (evs.length?evs:[e])){
    const [x,y] = toLocal(ev);
    const last = cur.pts[cur.pts.length-1];
    if(Math.hypot(x-last[0],y-last[1]) < 1.5) continue;
    cur.pts.push([x,y,widthFor(ev,last[2])]);
    drawSeg(ctx,cur,cur.pts.length-1);
  }
});
function endStroke(e){
  if(e.pointerId!==activeId) return;
  activeId = null;
  if(cur){ strokes.push(cur); redoStack=[]; cur=null; renderAll(); refreshStatus(); }
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

/* 太さが見えるカーソル（ペンのホバー・マウス） */
function moveCursor(e){
  if(e.pointerType==='touch'){ cursorEl.style.display='none'; return; }
  const r = cv.getBoundingClientRect();
  const d = st.tool==='fill' ? 12 : Math.max(6, st.size*r.width/W);
  cursorEl.style.display='block';
  cursorEl.style.width = cursorEl.style.height = d+'px';
  cursorEl.style.left = (e.clientX-r.left)+'px';
  cursorEl.style.top  = (e.clientY-r.top)+'px';
}
cv.addEventListener('pointerleave', ()=>{ cursorEl.style.display='none'; });

/* ---------- そうさ ---------- */
$('bUndo').onclick = () => { if(strokes.length<=base) return; redoStack.push(strokes.pop()); renderAll(); refreshStatus(); };
$('bRedo').onclick = () => { if(!redoStack.length) return; strokes.push(redoStack.pop()); renderAll(); refreshStatus(); };

$('bClear').onclick = () => { if(strokes.length && base===0) $('mClear').classList.add('show'); };
$('cNo').onclick = () => $('mClear').classList.remove('show');
$('cYes').onclick = () => {
  if(strokes.length) strokes.push({tool:'clear', pts:[]});
  $('mClear').classList.remove('show'); renderAll(); refreshStatus();
};
/* ゲーム側から使う窓口 */
window.CV = {
  reset(){ strokes=[]; redoStack=[]; cur=null; activeId=null; base=0; renderAll(); refreshStatus(); },
  lock(){ base=strokes.length; redoStack=[]; refreshStatus(); },
  soundOn(){ return st.sound; },
  audio(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); return ac; },
  has(){ return strokes.some(x=>x.tool!=='clear'); },
  img(){ const t=document.createElement('canvas'); t.width=600; t.height=400;
    t.getContext('2d').drawImage(cv,0,0,600,400);
    let u=t.toDataURL('image/webp',0.75); if(!u.startsWith('data:image/webp')) u=t.toDataURL('image/jpeg',0.75); return u; },
  fit(){ fit(); }
};
/* ---------- 画面サイズに合わせる ---------- */
function fit(){
  const vh = window.innerHeight;
  const hd = Math.round(Math.min(72, Math.max(48, vh*0.085)));
  const root = document.documentElement.style;
  root.setProperty('--hd', hd+'px');
  // パネルが入りきるいちばん大きいボタンサイズを実際に測って決める
  const mainEl = document.querySelector('main');
  const panels = [...document.querySelectorAll('.panel')];
  panels.forEach(p=>p.style.height='auto');
  let b = 64;
  for(; b>50; b--){
    root.setProperty('--b', b+'px');
    root.setProperty('--gap', Math.round(b*0.16)+'px');
    const need = Math.max(...panels.map(p=>p.getBoundingClientRect().height));
    const sr = stage.getBoundingClientRect();
    const paperH = Math.min(sr.width*2/3, sr.height-10);
    if(need + 8 <= mainEl.getBoundingClientRect().height && need <= paperH + 2) break;
  }
  requestAnimationFrame(()=>{
    const r = stage.getBoundingClientRect();
    const availW = r.width, availH = r.height - 10;
    let w = availW, h = w*2/3;
    if(h > availH){ h = availH; w = h*3/2; }
    wrap.style.width = Math.floor(w)+'px';
    wrap.style.height = Math.floor(h)+'px';
    // 左右パネルの高さを紙とそろえる（中身が入りきらないときは中身に合わせる）
    document.querySelectorAll('.panel').forEach(p=>{
      p.style.height='auto';
      p.style.height = Math.max(Math.floor(h), p.scrollHeight+6)+'px';
    });
  });
}
addEventListener('resize', fit);
new ResizeObserver(fit).observe(stage);

/* ---------- 事故防止 ---------- */
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('beforeunload', e=>{ if(window.GAME_ON){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('gesturestart', e=>e.preventDefault());

fit(); renderAll(); refreshStatus(); markColor();
})();
</script>

 'でんしゃ ひこうき じてんしゃ ろけっと ふね ばす くるま しょうぼうしゃ きゅうきゅうしゃ へりこぷたー しんかんせん とらっく ぱとかー せんすいかん ききゅう ' +
 'かさ めがね とけい えんぴつ らんどせる ぼうし くつ てぶくろ まふらー はさみ けしごむ のーと ほん つくえ いす てれび でんわ かぎ はぶらし ふうせん たいこ ぴあの ぎたー らっぱ ろぼっと かがみ でんきゅう ほうき ばけつ まくら ふとん やかん なべ すぷーん ふぉーく おはし こっぷ ぽすと しんごう はしご ろうそく かいちゅうでんとう ゆきだるま たからばこ ' +

 'がっこう こうえん ぷーる としょかん ゆうえんち どうぶつえん すいぞくかん おしろ たわー はなび おまつり うんどうかい かんらんしゃ じぇっとこーすたー すべりだい ぶらんこ てつぼう ' +
 'おばけ にんじゃ おうさま おひめさま かいじゅう うちゅうじん まほうつかい さむらい どらごん ようせい かっぱ てんぐ まじしゃん こっく うちゅうひこうし ' +
 'さっかー やきゅう すいえい なわとび すもう けんだま こま たこあげ').split(' ');
const MODS = ('ねている やさしそうな すーつをきた ひまそうな あかい そらをとぶ じゃんぷしている きんとれをしている こおりづけの はしっている あなをほる にじいろの ' +
 'きらきらの ふわふわの おおきな ちいさな ながーい まんまるの しかくい さんかくの おこっている わらっている ないている びっくりした ねむそうな はらぺこの おなかいっぱいの ' +
 'うたっている おどっている およいでいる さかだちしている ごはんをたべている ほんをよんでいる ぼうしをかぶった めがねをかけた まんとをつけた かさをさした ひげのはえた ' +
 'つのがはえた はねのはえた しっぽのある あたまがみっつの ろけっとにのった じてんしゃにのった すけーとをする さーふぃんをする つりをしている おふろにはいっている ' +
 'はみがきをしている かくれんぼしている ひかる とうめいな きんいろの ぎんいろの みずたまもようの しましまの もこもこの つるつるの とけている あつあつの ひえひえの ' +
 'ゆうしゃの うちゅうの みらいの むかしの まほうの おしゃれな かっこいい かわいい つよそうな げんきな のんびりした いそがしい まじめな ふしぎな にんきものの せかいいちの ' +
 'でんせつの ひみつの こわがりの ゆうかんな ちからもちの すごくはやい ぴかぴかの どろだらけの あわだらけの かぜにとばされた うみにうかぶ やまにのぼる きにのぼる てをふる ' +
 'おじぎをする ぴーすをする ぎたーをひく たいこをたたく えをかく てがみをかく かいものをする りょうりをする そうじをする なわとびをする さっかーをする やきゅうをする ' +
 'けーきをつくる おにぎりをにぎる ぱんをやく ゆきがっせんをする すなあそびをする しゃぼんだまをふく ふうせんをもった はなたばをもった たからばこをみつけた ほしをつかむ ' +
 'つきにすむ くものうえの みずのなかの もりのなかの まちをあるく でんしゃにのる はなびをみる さんぽをする ぐるぐるまわる ころがる ふくらんだ さかさまの ふたごの ' +
 'あくびをする くしゃみをする でんわをする てれびをみる げーむをする からてをする ばれえをおどる らじおたいそうをする おうかんをかぶった ねくたいをしめた ' +
 'えぷろんをつけた ながぐつをはいた さんぐらすをかけた まふらーをまいた おめんをつけた かめにのった くじらにのった たまごからうまれた ろぼっとになった おばけにばけた ' +
 'ぴあのをひく まらそんをする ひるねをする かくれている にげている おいかけている ぶらんこにのる すべりだいをすべる ろうそくをけす ちゅうがえりする').split(' ');

// なるべく同じことばが続かないよう、さいきん使ったものをよけて選ぶ
const RK = 'oekaki-relay-recent';
function recent(){ try{ return JSON.parse(localStorage.getItem(RK))||[]; }catch(e){ return []; } }
function pick(list, key){
  const used = recent(), cand = list.filter(w => !used.includes(key+':'+w));
  const w = (cand.length ? cand : list)[Math.floor(Math.random()*(cand.length||list.length))];
  used.push(key+':'+w); try{ localStorage.setItem(RK, JSON.stringify(used.slice(-120))); }catch(e){}
  return w;
}
const makeTopic = kind => kind==='hard' ? pick(MODS,'m')+' '+pick(NOUNS,'n') : pick(NOUNS,'n');

/* ---------- 効果音 ---------- */
function tone(f,t0,dur,type='triangle',vol=.15){
  if(!CV.soundOn()) return;
  try{ const ac=CV.audio(), o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+t0;
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02); }catch(e){}
}
const sDrum = sec => { for(let k=0;k<sec/0.06;k++) tone(120+Math.random()*40, k*0.06, .05, 'triangle', .06+.08*k/(sec/0.06)); };
const sReveal = () => [523,659,784,1047].forEach((f,i)=>tone(f,i*0.07,.35,'triangle',.16));
const sTick = () => tone(990,0,.06,'square',.05);
const sWin = () => [784,988,1175,1568,1175,1568].forEach((f,i)=>tone(f,i*0.1,.3,'triangle',.16));

/* ---------- 画面切りかえ ---------- */
const SCREENS = ['sTitle','sSetup','sPass','sPrompt','sWrite','sOrder','sReveal','sList','sHist'];
const show = id => SCREENS.forEach(x => $(x).classList.toggle('show', x===id));
const MODE_NAME = {A:'おえかきリレー', B:'えとことばリレー', C:'おえかきバトンパス'};
const spans = t => t.split(' ').map(w=>{ const s=document.createElement('span'); s.textContent=w; return s; });
const fillWords = (el,t) => { el.innerHTML=''; spans(t).forEach(s=>el.appendChild(s)); };
$('bigLogo').src = $('logo').src;

/* ---------- じゅんび ---------- */
const names = Array.from({length:10}, (_,i) => 'プレイヤー'+(i+1));
let N = 4, mode = 'B', topicKind = 'easy', timeSec = 0, game = null;
function renderNames(){
  const box = $('names'); box.innerHTML = '';
  for(let i=0;i<N;i++){ const inp=document.createElement('input'); inp.maxLength=8; inp.value=names[i];
    inp.oninput=()=>{ names[i]=inp.value; }; box.appendChild(inp); }
  $('pNum').textContent = N;
}
function setOpt(attr,val){ document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.classList.toggle('on', b.dataset[attr]===String(val))); }
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{ topicKind=b.dataset.topic; setOpt('topic',topicKind); $('tInput').classList.toggle('hide',topicKind!=='self'); });
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ timeSec=+b.dataset.time; setOpt('time',timeSec); });
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode; $('setupTitle').textContent = mode+'　'+MODE_NAME[mode];
  if(mode==='C' && timeSec===0) timeSec=15;       // バトンパスは15びょうがおすすめ
  setOpt('topic',topicKind); setOpt('time',timeSec); $('tInput').classList.toggle('hide',topicKind!=='self');
  renderNames(); show('sSetup');
});
$('pMinus').onclick = () => { if(N>3){ N--; renderNames(); } };
$('pPlus').onclick  = () => { if(N<10){ N++; renderNames(); } };
$('setupBack').onclick = () => show('sTitle');
$('goFree').onclick = () => {
  game=null; setTask('じゆうにかく','すきな絵を かこう'); $('bDone').textContent='タイトルへ';
  document.querySelectorAll('.dbg').forEach(e=>e.classList.remove('hide')); $('timerChip').classList.add('hide');
  CV.reset(); show(null); CV.fit();
};
$('setupGo').onclick = () => {
  const topic = topicKind==='self' ? $('tInput').value.trim().replace(/\s+/g,' ') : makeTopic(topicKind);
  if(!topic){ $('tInput').focus(); return; }
  game = {mode, topic, timer:timeSec, players:names.slice(0,N).map((n,i)=>n.trim()||('プレイヤー'+(i+1))), steps:[], i:0, date:Date.now()};
  $('tInput').value=''; window.GAME_ON=true;
  document.querySelectorAll('.dbg').forEach(e=>e.classList.add('hide'));
  toPass();
};

/* ---------- 1人ずつの番 ---------- */
// その番ですること：draw（絵をかく）／write（ことばを書く）
function stepKind(g,i){
  const last = i===g.players.length-1;
  if(g.mode==='B') return i%2===0 ? 'draw' : 'write';
  return last ? 'write' : 'draw';                 // AとCは最後の人だけ答えを書く
}
function setTask(who,text){ $('taskWho').textContent=who; $('taskText').textContent=text; }
function toPass(){
  const g=game, i=g.i, k=stepKind(g,i), last=i===g.players.length-1;
  $('passName').textContent = g.players[i]+' さん';
  $('passMsg').textContent =
    k==='write' ? (last ? 'まえの人の 絵を見て、おだいを 当てよう！' : 'まえの人の 絵を見て、なにの絵か 書こう。')
    : i===0 ? 'おだいを見て 絵をかこう。ほかの人は 見ないでね。'
    : g.mode==='A' ? 'まえの人の 絵を おぼえて、まっしろな紙に かこう。'
    : g.mode==='B' ? 'まえの人の ことばを見て 絵をかこう。'
    : 'おだいを見て、まえの人の 絵に かきたそう。';
  show('sPass');
}
$('passGo').onclick = () => {
  const g=game, i=g.i, prev=g.steps[i-1];
  if(stepKind(g,i)==='write'){
    $('wTitle').textContent = i===g.players.length-1 ? 'おだいは なんだった？' : 'これは なにの絵？';
    $('wImg').src = prev.img; $('wInput').value=''; show('sWrite');
    startTimer(()=>submitWrite(true));
    return;
  }
  $('prWho').textContent = g.players[i]+' さんの '+(g.mode==='A'&&i>0 ? 'ばん' : 'おだい');
  if(g.mode==='A' && i>0){
    $('prText').classList.add('hide'); $('prImg').classList.remove('hide'); $('prImg').src=prev.img;
    $('prNote').textContent='この絵を おぼえてね。ボタンを おすと 絵はきえます。'; $('prGo').textContent='おぼえた！';
  }else{
    const word = g.mode==='B' && i>0 ? prev.text : g.topic;
    $('prImg').classList.add('hide'); $('prText').classList.remove('hide'); fillWords($('prText'),'「'+word+'」');
    $('prNote').textContent = g.mode==='C' && i>0 ? 'まえの人の 絵の つづきを かこう。' : '';
    $('prGo').textContent='かきはじめる';
  }
  show('sPrompt');
};
$('prGo').onclick = () => {
  const g=game, i=g.i, prev=g.steps[i-1];
  const word = g.mode==='A' && i>0 ? 'おぼえた絵を かこう' : (g.mode==='B' && i>0 ? prev.text : g.topic);
  setTask(g.players[i]+' さん', g.mode==='A'&&i>0 ? word : '「'+word+'」');
  $('bDone').textContent='かんせい';
  if(g.mode==='C' && i>0) CV.lock(); else CV.reset();   // Cは同じ紙に かきたす
  show(null); CV.fit();
  startTimer(()=>submitDraw(true));
};
function submitDraw(auto){
  if(!auto && g_needsInk() && !CV.has()) return;
  stopTimer(); game.steps.push({who:game.players[game.i], type:'draw', img:CV.img()}); next();
}
const g_needsInk = () => !(game.mode==='C' && game.i>0);
$('bDone').onclick = () => { if(!game){ show('sTitle'); return; } submitDraw(false); };
function submitWrite(auto){
  let t = $('wInput').value.trim();
  if(!t){ if(!auto){ $('wInput').focus(); return; } t='（じかんぎれ）'; }
  stopTimer(); game.steps.push({who:game.players[game.i], type:'write', text:t}); next();
}
$('wGo').onclick = () => submitWrite(false);
$('wInput').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing) submitWrite(false); });
function next(){
  game.i++;
  if(game.i < game.players.length){ toPass(); return; }
  window.GAME_ON=false; saveHist(game); R=game; game=null; show('sOrder');
}

/* ---------- タイマー ---------- */
let tmr=null, left=0;
function paintTimer(){
  ['timerChip','wTimer'].forEach(id=>$(id).classList.toggle('urgent', left<=5));
  $('timerNum').textContent=left; $('wTimerNum').textContent=left;
}
function startTimer(onEnd){
  stopTimer();
  if(!game.timer) return;
  left=game.timer; paintTimer(); $('timerChip').classList.remove('hide'); $('wTimer').classList.remove('hide');
  tmr=setInterval(()=>{ left--; paintTimer(); if(left<=5 && left>0) sTick(); if(left<=0){ stopTimer(); onEnd(); } },1000);
}
function stopTimer(){ clearInterval(tmr); tmr=null; $('timerChip').classList.add('hide'); $('wTimer').classList.add('hide'); }

/* ---------- けっかはっぴょう ---------- */
let R=null, pages=[], pi=0, revealed=false, revT=null;
const norm = t => (t||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s「」。、！？!?]/g,'');
function startReveal(reverse){
  pages = [{kind:'topic'}].concat(R.steps.map((s,i)=>({kind:'step',s,i})));
  if(reverse) pages.reverse();
  pi=0; showPage(); show('sReveal');
}
$('oFwd').onclick = () => startReveal(false);
$('oRev').onclick = () => startReveal(true);
function pageTitle(p){
  if(p.kind==='topic') return 'さいしょの おだいは…';
  const s=p.s, last=p.i===R.steps.length-1;
  if(s.type==='write') return last ? s.who+' さんの こたえは…' : s.who+' さんが かんがえた ことばは…';
  return R.mode==='C' && p.i>0 ? s.who+' さんが かきたした 絵は…' : s.who+' さんが かいた 絵は…';
}
function showPage(){
  const p=pages[pi]; revealed=false; clearTimeout(revT);
  $('rvNo').textContent=(pi+1)+' / '+pages.length;
  $('rvTitle').textContent=pageTitle(p);
  const box=$('rvBox'); box.innerHTML='<div class="curtain">？</div>';
  $('rvNext').textContent = pi===pages.length-1 ? 'いちらんへ' : 'つぎへ';
  sDrum(1.3); revT=setTimeout(doReveal,1400);
}
function doReveal(){
  if(revealed) return; revealed=true; clearTimeout(revT);
  const p=pages[pi], box=$('rvBox'); box.innerHTML='';
  if(p.kind==='step' && p.s.type==='draw'){ const im=new Image(); im.src=p.s.img; im.className='reveal'; box.appendChild(im); }
  else{ const d=document.createElement('div'); d.className='say reveal'; fillWords(d,'「'+(p.kind==='topic'?R.topic:p.s.text)+'」'); box.appendChild(d); }
  sReveal();
  if(pi===pages.length-1){                       // さいごのページで、こたえあわせ
    const ans=R.steps[R.steps.length-1];
    if(ans.type==='write'){
      const st=document.createElement('div'), ok=norm(ans.text)===norm(R.topic);
      st.className='stamp'+(ok?'':' soso'); st.textContent= ok ? 'だいせいかい！' : 'どうだった？';
      setTimeout(()=>{ box.appendChild(st); if(ok) sWin(); },500);
    }
  }
}
$('rvBox').onclick = () => doReveal();
$('rvNext').onclick = () => {
  if(!revealed){ doReveal(); return; }
  if(pi<pages.length-1){ pi++; showPage(); } else openList(R,'sTitle');
};
$('rvList').onclick = () => { clearTimeout(revT); openList(R,'sTitle'); };

/* ---------- いちらん（へびのように ならべて、矢印でつなぐ） ---------- */
let listBack='sTitle';
const ARW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>';
function openList(g,back){
  R=g; listBack=back; clearTimeout(revT);
  $('lsTitle').textContent='いちらん　'+MODE_NAME[g.mode||'B']+'・'+g.players.length+'人';
  show('sList'); requestAnimationFrame(layoutList);
}
function layoutList(){
  const area=$('lsArea'); area.innerHTML='';
  const items=[{lab:'おだい',kind:'topic',text:R.topic}].concat(R.steps.map(s=>({lab:s.who,kind:s.type==='draw'?'img':'word',img:s.img,text:s.text})));
  const W=area.clientWidth, H=area.clientHeight, n=items.length, ag=40, vg=36, lab=24;
  let best=null;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols);
    let cw=(W-(cols-1)*ag)/cols;
    if(rows*(cw*2/3+lab)+(rows-1)*vg > H) cw=((H-(rows-1)*vg)/rows-lab)*1.5;
    if(!best || cw>best.cw) best={cols,rows,cw};
  }
  const {cols,rows}=best, cw=Math.floor(best.cw), bh=Math.floor(cw*2/3), ch=bh+lab;
  const ox=(W-(cols*cw+(cols-1)*ag))/2, oy=(H-(rows*ch+(rows-1)*vg))/2;
  const pos=i=>{ const r=Math.floor(i/cols); let c=i%cols; if(r%2) c=cols-1-c; return {x:ox+c*(cw+ag), y:oy+r*(ch+vg), r}; };
  items.forEach((it,i)=>{
    const p=pos(i), el=document.createElement('div'); el.className='lc';
    el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${cw}px`;
    const lb=document.createElement('div'); lb.className='lab';
    const no=document.createElement('i'); no.textContent=i+1; lb.appendChild(no); lb.appendChild(document.createTextNode(it.lab));
    const bx=document.createElement('div'); bx.className='bx '+it.kind; bx.style.height=bh+'px';
    if(it.kind==='img'){ const im=new Image(); im.src=it.img; bx.appendChild(im); }
    else{ bx.style.fontSize=Math.max(12,Math.round(cw*.1))+'px'; fillWords(bx,'「'+it.text+'」'); }
    el.appendChild(lb); el.appendChild(bx); area.appendChild(el);
    if(i<n-1){
      const q=pos(i+1), a=document.createElement('div'); a.className='arw'; a.innerHTML=ARW;
      if(q.r===p.r){ const lx=Math.min(p.x,q.x)+cw; a.style.left=(lx+(ag-28)/2)+'px'; a.style.top=(p.y+lab+bh/2-14)+'px'; if(q.x<p.x) a.style.transform='rotate(180deg)'; }
      else{ a.style.left=(p.x+cw/2-14)+'px'; a.style.top=(p.y+ch+(vg-28)/2+2)+'px'; a.style.transform='rotate(90deg)'; }
      area.appendChild(a);
    }
  });
}
addEventListener('resize',()=>{ if($('sList').classList.contains('show')) layoutList(); });
$('lsShow').onclick = () => show('sOrder');
$('lsBack').onclick = () => { if(listBack==='sHist') openHist(); else show('sTitle'); };
$('lsHome').onclick = () => show('sTitle');

/* ---------- りれき（ゲーム終了時に自動保存・最新5しあい） ---------- */
const HK='oekaki-relay-history';
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HK))||[]; }catch(e){ return []; } }
function saveHist(g){
  let h=loadHist(); h.unshift({mode:g.mode, topic:g.topic, players:g.players, steps:g.steps, date:g.date}); h=h.slice(0,5);
  while(h.length){ try{ localStorage.setItem(HK, JSON.stringify(h)); break; }catch(e){ h.pop(); } }
}
function openHist(){
  const h=loadHist(), box=$('hList'); box.innerHTML='';
  if(!h.length){ const p=document.createElement('p'); p.textContent='まだ りれきは ありません'; box.appendChild(p); }
  h.forEach(g=>{
    const b=document.createElement('button'), d=new Date(g.date);
    b.className='wbtn hist'; b.dataset.snd='act';
    b.textContent=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'　'+(g.mode||'B')+'・'+g.players.length+'人「'+g.topic+'」';
    b.onclick=()=>openList(g,'sHist'); box.appendChild(b);
  });
  show('sHist');
}
$('goHist').onclick = openHist;
$('hBack').onclick = () => show('sTitle');

window.__TEST__ = {NOUNS, MODS, makeTopic};
})();
